<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ctrl. — Live Deliverable Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.16);
    --text: #f0f0f0;
    --muted: #666;
    --muted2: #444;
    --accent: #ffffff;
    --green: #4ade80;
    --green-bg: rgba(74,222,128,0.08);
    --blue: #60a5fa;
    --blue-bg: rgba(96,165,250,0.08);
    --font-sans: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 32px 80px; }

  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 32px;
    border-bottom: 0.5px solid var(--border);
  }

  .wordmark {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .header h1 { font-size: 22px; font-weight: 300; color: var(--text); letter-spacing: -0.02em; }
  .header h1 span { font-weight: 500; }

  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    background: transparent;
    border: 0.5px solid var(--border-hover);
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .refresh-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }

  .refresh-btn svg { width: 13px; height: 13px; transition: transform 0.15s; }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .live-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .live-dot::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: blink 2s ease-in-out infinite;
  }

  .live-dot.error::before { background: #f87171; animation: none; }
  .live-dot.loading::before { background: var(--muted); animation: blink 0.6s ease-in-out infinite; }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .month-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 32px; }

  .month-btn {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 5px 12px;
    border-radius: 99px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .month-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .month-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 48px;
  }

  .stat-card { background: var(--surface); padding: 28px 24px; }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .stat-value {
    font-size: 48px;
    font-weight: 300;
    letter-spacing: -0.04em;
    color: var(--text);
    line-height: 1;
    transition: color 0.3s;
  }

  .stat-value.loading { color: var(--muted2); }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .client-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 48px;
  }

  .client-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    padding: 16px 20px;
    transition: background 0.1s;
  }

  .client-row:hover { background: var(--surface2); }
  .client-left { display: flex; align-items: center; gap: 14px; }

  .client-index {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted2);
    width: 18px;
    text-align: right;
  }

  .client-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .client-total { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 1px; }
  .client-badges { display: flex; gap: 6px; }

  .badge {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 99px;
    font-weight: 500;
  }

  .badge-active { background: var(--blue-bg); color: var(--blue); border: 0.5px solid rgba(96,165,250,0.2); }
  .badge-done { background: var(--green-bg); color: var(--green); border: 0.5px solid rgba(74,222,128,0.2); }
  .badge-zero { color: var(--muted2); background: transparent; border: 0.5px solid var(--border); }
  .badge-error { color: #f87171; background: rgba(248,113,113,0.08); border: 0.5px solid rgba(248,113,113,0.2); }

  .skeleton-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    padding: 16px 20px;
  }

  .skel {
    border-radius: 4px;
    background: linear-gradient(90deg, var(--surface2) 25%, #222 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }

  @keyframes shimmer { to { background-position: -200% 0; } }

  .error-banner {
    background: rgba(248,113,113,0.08);
    border: 0.5px solid rgba(248,113,113,0.2);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 12px;
    color: #f87171;
    margin-bottom: 24px;
    font-family: var(--font-mono);
    line-height: 1.6;
  }

  .footer {
    border-top: 0.5px solid var(--border);
    padding-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-left { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--muted); }
  .footer-right { font-family: var(--font-mono); font-size: 10px; color: var(--muted2); }

  @media (max-width: 600px) {
    .wrap { padding: 32px 20px 60px; }
    .stats-grid { grid-template-columns: 1fr; }
    .header { flex-direction: column; gap: 16px; }
    .header-right { align-items: flex-start; }
    .stat-value { font-size: 36px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="wordmark">ctrl. agency</div>
      <h1>deliverable <span>status</span></h1>
    </div>
    <div class="header-right">
      <button class="refresh-btn" id="refreshBtn" onclick="loadAll()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
        Refresh
      </button>
      <div class="live-dot loading" id="liveDot">Connecting</div>
    </div>
  </div>

  <div class="month-row" id="monthRow"></div>

  <div id="errorBanner" style="display:none" class="error-banner"></div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total deliverables</div>
      <div class="stat-value loading" id="statTotal">—</div>
      <div class="stat-sub" id="statSub">loading...</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">In progress</div>
      <div class="stat-value loading" id="statProgress">—</div>
      <div class="stat-sub">filming · editing · review</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Completed</div>
      <div class="stat-value loading" id="statDone">—</div>
      <div class="stat-sub">uploaded · finalised</div>
    </div>
  </div>

  <div class="section-header">
    <div class="section-label">By client</div>
    <div class="section-label" id="clientCount"></div>
  </div>

  <div class="client-list" id="clientList">
    <div class="skeleton-row"><div class="skel" style="width:140px;height:13px"></div><div class="skel" style="width:100px;height:22px;border-radius:99px"></div></div>
    <div class="skeleton-row"><div class="skel" style="width:180px;height:13px"></div><div class="skel" style="width:100px;height:22px;border-radius:99px"></div></div>
    <div class="skeleton-row"><div class="skel" style="width:120px;height:13px"></div><div class="skel" style="width:100px;height:22px;border-radius:99px"></div></div>
    <div class="skeleton-row"><div class="skel" style="width:160px;height:13px"></div><div class="skel" style="width:100px;height:22px;border-radius:99px"></div></div>
    <div class="skeleton-row"><div class="skel" style="width:100px;height:13px"></div><div class="skel" style="width:100px;height:22px;border-radius:99px"></div></div>
  </div>

  <div class="footer">
    <div class="footer-left" id="lastUpdated">Fetching data...</div>
    <div class="footer-right">ctrl. internal</div>
  </div>

</div>
<script>
const IN_PROGRESS = ['FILMED','UPLOADED TO GD','STARTED PROJECT','STAGE 1: ROUGH CUTS','STAGE 2: B-ROLL','STAGE 3: FONT LAYERING','CTRL. REVIEW'];
const DONE = ['UPLOADED','Revision Completed','Deliverable Finalised'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const CLIENTS = [
  { name: 'ctrl.', dbId: '2e5c759b-a92b-8159-8e92-f13de83bf36a' },
  { name: 'Mr Summit Bali', dbId: '32dc759b-a92b-817d-a1c4-ddce904ff4ee' },
  { name: 'Mr Summit Melbourne', dbId: '2dfc759b-a92b-81fd-a5f8-ce920bcfb408' },
  { name: 'John Sugden Swim School', dbId: '2a9c759b-a92b-81e1-8284-c4193c5431d1' },
  { name: 'Deepmock', dbId: '330c759b-a92b-81dd-8deb-c5e89094db03' },
];

let selectedMonth = MONTHS[new Date().getMonth()];
let allData = [];

function buildMonths() {
  const el = document.getElementById('monthRow');
  el.innerHTML = '';
  MONTHS.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (m === selectedMonth ? ' active' : '');
    btn.textContent = m;
    btn.onclick = () => { selectedMonth = m; buildMonths(); renderStats(); };
    el.appendChild(btn);
  });
}

async function queryDb(dbId) {
  const res = await fetch('/api/notion', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ databaseId: dbId })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  const d = await res.json();
  return d.results || [];
}

function getStatus(page) {
  const s = page.properties?.Status;
  if (!s) return null;
  if (s.type === 'status') return s.status?.name || null;
  if (s.type === 'select') return s.select?.name || null;
  return null;
}

function getMonth(page) {
  const props = page.properties || {};
  for (const key of Object.keys(props)) {
    const p = props[key];
    if (p.type === 'select' && MONTHS.includes(p.select?.name)) return p.select.name;
  }
  return null;
}

function renderStats() {
  let total = 0, inProg = 0, done = 0;
  const rows = [];

  allData.forEach(({ name, pages, error, errorMsg }) => {
    const filtered = pages.filter(p => getMonth(p) === selectedMonth);
    const t = filtered.length;
    const ip = filtered.filter(p => IN_PROGRESS.includes(getStatus(p))).length;
    const d = filtered.filter(p => DONE.includes(getStatus(p))).length;
    total += t; inProg += ip; done += d;
    rows.push({ name, total: t, inProgress: ip, done: d, error, errorMsg });
  });

  ['statTotal','statProgress','statDone'].forEach(id => document.getElementById(id).classList.remove('loading'));
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statProgress').textContent = inProg;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statSub').textContent = `${selectedMonth} · ${allData.filter(d => !d.error).length} clients`;
  document.getElementById('clientCount').textContent = `${allData.length} connected`;

  const list = document.getElementById('clientList');
  list.innerHTML = '';
  rows.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'client-row';
    row.innerHTML = `
      <div class="client-left">
        <div class="client-index">${String(i + 1).padStart(2, '0')}</div>
        <div>
          <div class="client-name">${c.name}</div>
          <div class="client-total">${c.error ? c.errorMsg : `${c.total} deliverable${c.total !== 1 ? 's' : ''} · ${selectedMonth}`}</div>
        </div>
      </div>
      <div class="client-badges">
        ${c.error
          ? `<span class="badge badge-error">error</span>`
          : `<span class="badge ${c.inProgress > 0 ? 'badge-active' : 'badge-zero'}">${c.inProgress} active</span>
             <span class="badge ${c.done > 0 ? 'badge-done' : 'badge-zero'}">${c.done} done</span>`
        }
      </div>`;
    list.appendChild(row);
  });
}

async function loadAll() {
  const btn = document.getElementById('refreshBtn');
  const dot = document.getElementById('liveDot');
  btn.classList.add('spinning');
  dot.className = 'live-dot loading';
  dot.textContent = 'Connecting';
  document.getElementById('errorBanner').style.display = 'none';
  ['statTotal','statProgress','statDone'].forEach(id => {
    const el = document.getElementById(id);
    el.textContent = '—';
    el.classList.add('loading');
  });

  const results = await Promise.allSettled(CLIENTS.map(c => queryDb(c.dbId)));

  allData = results.map((r, i) => ({
    name: CLIENTS[i].name,
    pages: r.status === 'fulfilled' ? r.value : [],
    error: r.status === 'rejected',
    errorMsg: r.status === 'rejected' ? r.reason.message : null
  }));

  const errors = allData.filter(d => d.error);
  if (errors.length > 0) {
    const eb = document.getElementById('errorBanner');
    eb.style.display = 'block';
    eb.innerHTML = `Could not reach: <strong>${errors.map(e => e.name).join(', ')}</strong><br>Check that your Notion integration is connected to those pages, then refresh.`;
    dot.className = 'live-dot error';
    dot.textContent = `${errors.length} error${errors.length > 1 ? 's' : ''}`;
  } else {
    dot.className = 'live-dot';
    dot.textContent = 'Live';
  }

  renderStats();

  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    `Updated ${now.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' })} · ${now.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}`;

  btn.classList.remove('spinning');
}

buildMonths();
loadAll();
</script>
</body>
</html>
